name: CI

# Runs on every change to main and on pull requests. Results appear under the "Actions" tab of your repo.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App tests, types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint

  database:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Builds a throwaway database from supabase/migrations, then runs supabase/tests/database
      - run: supabase start
      - run: supabase test db
