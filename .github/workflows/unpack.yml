name: Unpack starter project (one time)

# Run once: upload the project .zip to the repository and this unpacks it into proper folders.
# It REPLACES everything in the repository (except .github) with the contents of the zip.
# Delete this file after the first successful run so it can never run again by accident.
on:
  push:
    branches: [main]
    paths: ['*.zip']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the zip into the repository root
        run: |
          ZIP=$(ls ./*.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then echo "No .zip in the repository root, nothing to do."; exit 0; fi
          echo "Unpacking $ZIP"
          rm -rf /tmp/unpacked && mkdir /tmp/unpacked
          unzip -q "$ZIP" -d /tmp/unpacked
          SRC=$(find /tmp/unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -f "$SRC/package.json" || { echo "package.json not found in the zip"; exit 1; }
          # remove everything except git data and workflows, then copy the project in
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SRC"/. .
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack starter project"
          git push
